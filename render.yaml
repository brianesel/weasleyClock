# Render Blueprint: one-click configuration for a web service + persistent disk.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: weasley-travel-tracker
    runtime: node
    plan: free # bump to "starter" or higher to avoid cold starts
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        sync: false # set this yourself in the Render dashboard (don't commit secrets)
    disk:
      name: weasley-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
