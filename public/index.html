<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Where in the world? · Travel Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand-mark">🧭</span>
      <span class="brand-text">Weasley Travel Tracker</span>
    </div>
    <nav>
      <a href="/" class="active">Home</a>
      <a href="/admin.html">Admin</a>
    </nav>
  </header>

  <main>
    <section class="clock-section">
      <h1>Where am I right now?</h1>
      <p class="subtitle" id="statusSummary">Consulting the clock&hellip;</p>

      <div class="clock-wrap">
        <!-- The clock face is drawn with SVG; the hand is rotated via JS. -->
        <svg id="clock" viewBox="0 0 400 400" role="img" aria-label="Travel status clock">
          <defs>
            <radialGradient id="faceGrad" cx="50%" cy="45%" r="70%">
              <stop offset="0%" stop-color="#3b2a1a" />
              <stop offset="70%" stop-color="#2a1d10" />
              <stop offset="100%" stop-color="#1c130a" />
            </radialGradient>
            <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="3" result="b" />
              <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
            </filter>
          </defs>

          <!-- Outer rings -->
          <circle cx="200" cy="200" r="196" fill="#0d0906" />
          <circle cx="200" cy="200" r="190" fill="none" stroke="#caa24a" stroke-width="6" />
          <circle cx="200" cy="200" r="176" fill="url(#faceGrad)" stroke="#7a5a24" stroke-width="2" />
          <circle cx="200" cy="200" r="150" fill="none" stroke="#5a4526" stroke-width="1" stroke-dasharray="2 4" />

          <!-- Tick marks + labels get injected here -->
          <g id="ticks"></g>
          <g id="labels"></g>

          <!-- Hand -->
          <g id="hand" style="transition: transform 1.1s cubic-bezier(.2,.9,.2,1); transform-origin: 200px 200px;">
            <polygon points="200,206 194,200 200,44 206,200" fill="#e9d18a" filter="url(#softGlow)" />
            <circle cx="200" cy="44" r="7" fill="#fff4d0" stroke="#caa24a" stroke-width="2" />
          </g>
          <circle cx="200" cy="200" r="14" fill="#1c130a" stroke="#caa24a" stroke-width="3" />
          <circle cx="200" cy="200" r="5" fill="#e9d18a" />
        </svg>
      </div>

      <div class="status-pill" id="statusPill">Home</div>
    </section>

    <section class="trips-section">
      <div class="trips-head">
        <h2>Upcoming trips</h2>
        <p class="muted">See where I'm headed &mdash; and grab a spot to come along.</p>
      </div>
      <div id="tripList" class="trip-list">
        <p class="muted loading">Loading trips&hellip;</p>
      </div>
    </section>
  </main>

  <!-- Signup modal -->
  <div id="signupModal" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="signupTitle">
      <button class="modal-close" id="signupClose" aria-label="Close">&times;</button>
      <h3 id="signupTitle">Sign up to join</h3>
      <p class="muted" id="signupTripInfo"></p>
      <form id="signupForm">
        <label>Your name <span class="req">*</span>
          <input type="text" name="name" required maxlength="80" autocomplete="name" />
        </label>
        <label>Email
          <input type="email" name="email" maxlength="120" autocomplete="email" />
        </label>
        <label>Note (optional)
          <textarea name="note" rows="3" maxlength="300" placeholder="Anything you want me to know?"></textarea>
        </label>
        <p class="form-error" id="signupError" hidden></p>
        <button type="submit" class="btn btn-primary">Count me in</button>
      </form>
    </div>
  </div>

  <footer class="site-footer">
    <p>Built with a Weasley clock &mdash; but nobody's in prison, just at <em>high altitude</em>.</p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
